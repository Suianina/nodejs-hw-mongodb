tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact for the authenticated user
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            example: 'Zhanna Suianina'
          phoneNumber:
            type: string
            example: '+380980185554'
          email:
            type: string
            example: 'cezyby3@gmail.com'
          contactType:
            type: string
            enum: [work, home, personal]
            example: 'personal'
          isFavorite:
            type: boolean
            example: false
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml'
  '400':
    description: Bad request
  '401':
    description: Unauthorized

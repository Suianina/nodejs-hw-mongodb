tags:
  - Contacts
summary: Update contact by ID
operationId: updateContactById
description: Update a specific contact by its ID
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      pattern: '^[0-9a-fA-F]{24}$'
    description: Contact ID
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'Zhanna Suianina'
          phoneNumber:
            type: string
            example: '+380980185554'
          email:
            type: string
            example: 'cezyby3@gmail.com'
          contactType:
            type: string
            enum: [work, home, personal]
            example: 'personal'
          isFavorite:
            type: boolean
            example: false
responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml'
  '404':
    $ref: '../../../components/responses.yaml'

tags:
  - Auth
summary: Reset password
operationId: resetPassword
description: Reset password using the token from reset email
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - password
          - token
        properties:
          password:
            type: string
            example: 'newpassword123'
          token:
            type: string
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2ODY2OTQ4NGQ5MDZmYmVkMzYyMGY3YjUiLCJpYXQiOjE3NTIwNTYxNTksImV4cCI6MTc1MjA1OTc1OX0.example'
responses:
  '200':
    description: Password reset successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Password reset successfully'
  '400':
    description: Bad request - validation error
  '401':
    description: Unauthorized - invalid or expired token

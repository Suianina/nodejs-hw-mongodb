tags:
  - Auth
summary: Register a new user
operationId: registerUser
description: Create a new user account with name, email, and password
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 30
            example: 'Zhanna Suianina'
          email:
            type: string
            format: email
            example: 'cezyby3@gmail.com'
          password:
            type: string
            example: 'password123'
responses:
  '201':
    description: User registered successfully
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/user'
  '400':
    description: Bad request - validation error
  '409':
    description: Conflict - user already exists

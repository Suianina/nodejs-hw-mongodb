tags:
  - Auth
summary: Login user
operationId: loginUser
description: Authenticate user with email and password
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            format: email
            example: 'cezyby3@gmail.com'
          password:
            type: string
            example: 'password123'
responses:
  '200':
    description: User logged in successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully login user'
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2ODY2OTQ4NGQ5MDZmYmVkMzYyMGY3YjUiLCJpYXQiOjE3NTIwNTYxNTksImV4cCI6MTc1MjA1OTc1OX0.example'
    headers:
      Set-Cookie:
        description: Session cookies
        schema:
          type: string
          example: 'refreshToken=abc123; HttpOnly; Path=/'
  '400':
    description: Bad request - validation error
  '401':
    description: Unauthorized - invalid credentials

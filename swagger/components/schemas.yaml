type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
properties:
  _id:
    type: string
    pattern: '^[0-9a-fA-F]{24}$'
    example: '68669484d906fbed3620f7b5'
  name:
    type: string
    example: 'Zhanna Suianina'
  phoneNumber:
    type: string
    example: '+380980185554'
  email:
    type: string
    example: 'cezyby3@gmail.com'
  contactType:
    type: string
    enum: [work, home, personal]
  isFavorite:
    type: boolean
    example: false
  userId:
    type: string
    example: '68669484d906fbed3620f7b5'
  photo:
    type: string
    example: 'https://res.cloudinary.com/dypusvd55/image/upload/v1752056159/w37shxwdetharukoowwf.jpg'

type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
properties:
  _id:
    description: "Contact's id"
    type: string
    example: '68669484d906fbed3620f7b5'
  name:
    description: "Contact's name"
    type: string
    example: 'Zhanna Suianina'
  phoneNumber:
    description: "Contact's number"
    type: string
    example: '+380980185554'
  email:
    description: "Contact's email"
    type: string
    example: 'cezyby3@gmail.com'
  contactType:
    description: "Contacts's type"
    type: string
    enum: ['work', 'home', 'personal']
  isFavourite:
    description: 'Favorite contact'
    type: boolean
    example: false
  userId:
    description: "Contact's user id"
    type: string
    example: '68669484d906fbed3620f7b5'
  photo:
    description: "Link to contacts's photo"
    type: string
    example: https://res.cloudinary.com/dypusvd55/image/upload/v1752056159/w37shxwdetharukoowwf.jpg

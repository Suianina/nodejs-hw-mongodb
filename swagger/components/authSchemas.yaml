user:
  type: object
  required:
    - _id
    - name
    - email
  properties:
    _id:
      type: string
      pattern: '^[0-9a-fA-F]{24}$'
      example: '68669484d906fbed3620f7b5'
    name:
      type: string
      minLength: 3
      maxLength: 30
      example: 'Zhanna Suianina'
    email:
      type: string
      format: email
      example: 'cezyby3@gmail.com'
    createdAt:
      type: string
      format: date-time
      example: '2024-01-15T10:30:00.000Z'
    updatedAt:
      type: string
      format: date-time
      example: '2024-01-15T10:30:00.000Z'

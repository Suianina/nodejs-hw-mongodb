openapi: 3.1.0
info:
  title: Contacts API
  version: 1.0.0
  description: API for managing user contacts and authentication
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
tags:
  - name: Contacts
    description: Operations for managing user contacts
  - name: Auth
    description: Authentication and authorization operations
servers:
  - url: https://nodejs-hw-mongodb-2-6e55.onrender.com
    description: Production server (Render)
security: []
paths:
  /auth/register:
    post:
      $ref: '../swagger/paths/auth/register.yaml'
  /auth/login:
    post:
      $ref: '../swagger/paths/auth/login.yaml'
  /auth/refresh:
    post:
      $ref: '../swagger/paths/auth/refresh.yaml'
  /auth/logout:
    post:
      $ref: '../swagger/paths/auth/logout.yaml'
  /auth/send-reset-email:
    post:
      $ref: '../swagger/paths/auth/send-reset-email.yaml'
  /auth/reset-pwd:
    post:
      $ref: '../swagger/paths/auth/reset-pwd.yaml'
  /auth/get-google-oauth-link:
    post:
      $ref: '../swagger/paths/auth/get-google-oauth-link.yaml'
  /auth/authorize-with-google-oauth:
    post:
      $ref: '../swagger/paths/auth/authorize-with-google-oauth.yaml'
  /contacts:
    get:
      $ref: '../swagger/paths/contacts/get.yaml'
    post:
      $ref: '../swagger/paths/contacts/post.yaml'
  /contacts/{id}:
    get:
      $ref: '../swagger/paths/contacts/{id}/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/{id}/patch.yaml'
    delete:
      $ref: '../swagger/paths/contacts/{id}/delete.yaml'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    contact:
      $ref: '../swagger/components/schemas.yaml'
    user:
      $ref: '../swagger/components/authSchemas.yaml'
  responses:
    NotFound:
      $ref: '../swagger/components/responses.yaml'

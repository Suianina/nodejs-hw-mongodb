openapi: 3.1.0
info:
  title: Contacts API
  version: 1.0.0
  description: API for managing user contacts and authentication
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
tags:
  - name: Contacts
    description: Operations for managing user contacts
  - name: Auth
    description: Authentication and authorization operations
servers:
  - url: https://nodejs-hw-mongodb-2-6e55.onrender.com
    description: Production server (Render)
security: []
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      operationId: registerUser
      description: Create a new user account with name, email, and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 30
                  example: 'Zhanna Suianina'
                email:
                  type: string
                  format: email
                  example: 'cezyby3@gmail.com'
                password:
                  type: string
                  minLength: 6
                  maxLength: 30
                  example: 'password123'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Successfully registered user!
                  data:
                    $ref: '#/components/schemas/user'
        '400':
          description: Bad request - validation error
        '409':
          description: Conflict - user already exists
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login user
      operationId: loginUser
      description: Authenticate user with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: 'cezyby3@gmail.com'
                password:
                  type: string
                  minLength: 6
                  maxLength: 30
                  example: 'password123'
      responses:
        '200':
          description: User logged in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully logged in an user!
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2ODY2OTQ4NGQ5MDZmYmVkMzYyMGY3YjUiLCJpYXQiOjE3NTIwNTYxNTksImV4cCI6MTc1MjA1OTc1OX0.example'
        '400':
          description: Bad request - validation error
        '401':
          description: Unauthorized - invalid credentials
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout user
      operationId: logoutUser
      description: Deletes the user session based on sessionId and refreshToken, which are read from cookies. Clears cookies and terminates the session.
      security: []
      responses:
        '204':
          description: User logged out successfully
        '401':
          description: Unauthorized - invalid session
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      operationId: refreshToken
      description: Refreshes the user session based on the refreshToken read from cookies. The previous session is deleted and a new session with new tokens is created. The new accessToken is returned in the response, and the new refreshToken is set in cookies.
      security: []
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully refreshed a session!
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2ODY2OTQ4NGQ5MDZmYmVkMzYyMGY3YjUiLCJpYXQiOjE3NTIwNTYxNTksImV4cCI6MTc1MjA1OTc1OX0.example'
        '401':
          description: Unauthorized - invalid or expired refresh token
  /auth/send-reset-email:
    post:
      tags:
        - Auth
      summary: Send password reset email
      operationId: sendResetEmail
      description: Send a password reset email to the specified email address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: 'cezyby3@gmail.com'
      responses:
        '200':
          description: Reset email sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Reset password email has been successfully sent.
                  data:
                    type: object
                    example: {}
        '400':
          description: Bad request - validation error
        '404':
          description: User not found
  /auth/reset-pwd:
    post:
      tags:
        - Auth
      summary: Reset password
      operationId: resetPassword
      description: Reset password using the token from reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
                - token
              properties:
                password:
                  type: string
                  minLength: 6
                  maxLength: 30
                  example: 'newpassword123'
                token:
                  type: string
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2ODY2OTQ4NGQ5MDZmYmVkMzYyMGY3YjUiLCJpYXQiOjE3NTIwNTYxNTksImV4cCI6MTc1MjA1OTc1OX0.example'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Password has been successfully reset.
                  data:
                    type: object
                    example: {}
        '400':
          description: Bad request - validation error
        '401':
          description: Unauthorized - invalid or expired token
  /auth/get-google-oauth-link:
    post:
      tags:
        - Auth
      summary: Get Google OAuth URL
      operationId: getGoogleOAuthLink
      description: Get the Google OAuth authorization URL for user authentication
      security: []
      responses:
        '200':
          description: Google OAuth link generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Google OAuth link generated successfully
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        example: 'https://accounts.google.com/o/oauth2/auth?...'
        '401':
          description: Unauthorized - user is not authenticated
        '500':
          description: Internal server error
  /auth/authorize-with-google-oauth:
    post:
      tags:
        - Auth
      summary: Authorize with Google OAuth
      operationId: authorizeWithGoogleOAuth
      description: Complete Google OAuth authentication using the authorization code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  example: '4/0AfJohXn...'
      responses:
        '200':
          description: Google OAuth authorization successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully authorized with Google
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2ODY2OTQ4NGQ5MDZmYmVkMzYyMGY3YjUiLCJpYXQiOjE3NTIwNTYxNTksImV4cCI6MTc1MjA1OTc1OX0.example'
        '400':
          description: Bad request - validation error
        '401':
          description: Unauthorized - invalid authorization code
        '500':
          description: Internal server error
  /contacts:
    get:
      tags:
        - Contacts
      summary: Get list of contacts
      operationId: getContacts
      description: Retrieve a paginated list of contacts with optional filters
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: perPage
          schema:
            type: integer
            default: 10
          description: Items per page
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [name, email, contactType, createdAt]
            default: createdAt
          description: Field to sort by
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order
        - in: query
          name: type
          schema:
            type: string
            enum: [work, home, personal]
          description: Filter by contact type
        - in: query
          name: isFavourite
          schema:
            type: boolean
          description: Filter by favourite status
      responses:
        '200':
          description: Successfully retrieved contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully found contacts!
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/contact'
                      page:
                        type: integer
                        example: 1
                      perPage:
                        type: integer
                        example: 10
                      totalItems:
                        type: integer
                        example: 25
                      totalPages:
                        type: integer
                        example: 3
                      hasPreviousPage:
                        type: boolean
                        example: false
                      hasNextPage:
                        type: boolean
                        example: true
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Contacts
      summary: Create a new contact
      operationId: createContact
      description: Create a new contact for the authenticated user
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - phoneNumber
                - contactType
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 20
                  example: 'Zhanna Suianina'
                phoneNumber:
                  type: string
                  minLength: 3
                  maxLength: 20
                  example: '+380980185554'
                email:
                  type: string
                  minLength: 3
                  maxLength: 20
                  example: 'cezyby3@gmail.com'
                contactType:
                  type: string
                  enum: [work, home, personal]
                  example: 'personal'
                isFavourite:
                  type: boolean
                  example: false
                photo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Contact created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Contact created successfully
                  data:
                    $ref: '#/components/schemas/contact'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  /contacts/{id}:
    get:
      tags:
        - Contacts
      summary: Get contact by ID
      operationId: getContactById
      description: Retrieve a specific contact by its ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          description: Contact ID
      responses:
        '200':
          description: Contact found successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully found contact!
                  data:
                    $ref: '#/components/schemas/contact'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Contacts
      summary: Update contact by ID
      operationId: updateContactById
      description: Update a specific contact by its ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          description: Contact ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 20
                  example: 'Zhanna Suianina'
                phoneNumber:
                  type: string
                  minLength: 3
                  maxLength: 20
                  example: '+380980185554'
                email:
                  type: string
                  minLength: 3
                  maxLength: 20
                  example: 'cezyby3@gmail.com'
                contactType:
                  type: string
                  enum: [work, home, personal]
                  example: 'personal'
                isFavourite:
                  type: boolean
                  example: false
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Contact updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully patched a contact!
                  data:
                    $ref: '#/components/schemas/contact'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Contacts
      summary: Delete contact by ID
      operationId: deleteContactById
      description: Delete a specific contact by its ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          description: Contact ID
      responses:
        '200':
          description: Contact deleted successfully
          content:
            application/json:
              schema:
                type:
                  - object
                  - 'null'
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Contact deleted successfully
                  data:
                    type:
                      - object
                      - 'null'
                    example: null
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    contact:
      type: object
      required:
        - _id
        - name
        - phoneNumber
        - contactType
      properties:
        _id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: '68669484d906fbed3620f7b5'
        name:
          type: string
          minLength: 3
          maxLength: 20
          example: 'Zhanna Suianina'
        phoneNumber:
          type: string
          minLength: 3
          maxLength: 20
          example: '+380980185554'
        email:
          type: string
          minLength: 3
          maxLength: 20
          example: 'cezyby3@gmail.com'
        contactType:
          type: string
          enum: [work, home, personal]
        isFavourite:
          type: boolean
          example: false
        userId:
          type: string
          example: '68669484d906fbed3620f7b5'
        photo:
          type: string
          example: 'https://res.cloudinary.com/dypusvd55/image/upload/v1752056159/w37shxwdetharukoowwf.jpg'
    user:
      type: object
      required:
        - _id
        - name
        - email
      properties:
        _id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: '68669484d906fbed3620f7b5'
        name:
          type: string
          minLength: 3
          maxLength: 30
          example: 'Zhanna Suianina'
        email:
          type: string
          format: email
          example: 'cezyby3@gmail.com'
        createdAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'
  responses:
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: Resource not found

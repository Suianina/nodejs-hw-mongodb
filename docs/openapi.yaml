openapi: 3.1.0
info:
  title: Contacts API
  version: 1.0.0
  description: API for managing user contacts and authentication
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
tags:
  - name: Contacts
    description: Operations for managing user contacts
  - name: Auth
    description: Authentication and authorization operations
servers:
  - url: https://nodejs-hw-mongodb-2-6e55.onrender.com
    description: Production server (Render)
security: []
paths:
  /auth/register:
    post:
      $ref: '../swagger/paths/auth/register.yaml'
  /auth/login:
    post:
      $ref: '../swagger/paths/auth/login.yaml'
  /auth/refresh:
    post:
      $ref: '../swagger/paths/auth/refresh.yaml'
  /auth/logout:
    post:
      $ref: '../swagger/paths/auth/logout.yaml'
  /auth/send-reset-email:
    post:
      $ref: '../swagger/paths/auth/send-reset-email.yaml'
  /auth/reset-pwd:
    post:
      $ref: '../swagger/paths/auth/reset-pwd.yaml'
  /auth/get-google-oauth-link:
    post:
      $ref: '../swagger/paths/auth/get-google-oauth-link.yaml'
  /auth/authorize-with-google-oauth:
    post:
      $ref: '../swagger/paths/auth/authorize-with-google-oauth.yaml'
  /contacts:
    get:
      $ref: '../swagger/paths/contacts/get.yaml'
    post:
      $ref: '../swagger/paths/contacts/post.yaml'
  /contacts/{id}:
    get:
      $ref: '../swagger/paths/contacts/{id}/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/{id}/patch.yaml'
    delete:
      $ref: '../swagger/paths/contacts/{id}/delete.yaml'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    contact:
      type: object
      required:
        - _id
        - name
        - phoneNumber
        - contactType
      properties:
        _id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: '68669484d906fbed3620f7b5'
        name:
          type: string
          example: 'Zhanna Suianina'
        phoneNumber:
          type: string
          example: '+380980185554'
        email:
          type: string
          example: 'cezyby3@gmail.com'
        contactType:
          type: string
          enum: [work, home, personal]
        isFavorite:
          type: boolean
          example: false
        userId:
          type: string
          example: '68669484d906fbed3620f7b5'
        photo:
          type: string
          example: 'https://res.cloudinary.com/dypusvd55/image/upload/v1752056159/w37shxwdetharukoowwf.jpg'
    user:
      type: object
      required:
        - _id
        - name
        - email
      properties:
        _id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: '68669484d906fbed3620f7b5'
        name:
          type: string
          minLength: 3
          maxLength: 30
          example: 'Zhanna Suianina'
        email:
          type: string
          format: email
          example: 'cezyby3@gmail.com'
        createdAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'
  responses:
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: Resource not found
